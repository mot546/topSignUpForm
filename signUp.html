<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="javascript.js"></script>
    <title>Sign Up Form</title>
</head>
<body>
    <div class="odin-logo"> 
        <div class="logo-container">
            <img src="./odin-lined.png" alt="TOP Logo">
            <h1>ODIN</h1>
        </div>
    </div>
    <div class="right-side">
    
            <div class="quote">
                <p>This is not a real online service! You know you need something
                    like this in your life to help you realize your deepest dreams.<br>
                    Sign up <em>now</em> to get started. <br><br>
                    You <em>know</em> you want to.
                    </p>
                </div>
    
                    <form action="" class="sign-up-form" method="get" id="form-deepest-dream">
    
                        <h1>Let's do this!</h1>
                        <div class="input-group">
                            <div class="partner">
                                <div><label for="first-name" name="first-name" >FIRST NAME</label> <input type="text" id="first-name" ></div>
                                <div><label for="last-name" name="last-name">LAST NAME</label> <input type="text" id="last-name"></div>
                            </div>

                            <div class="partner">
                                <div><label for="email" name="email">EMAIL</label> <input type="email" id="email"></div>
                                <div><label for="number">PHONE NUMBER</label> <input id="number" type="tel"></div>
                            </div>

                            <div class="partner">
                                <div><label for="password">PASSWORD</label><input type="password" minlength="8" id="password"></div>
                                <div><label for="password">CONFIRM PASSWORD</label><input id="password" minlength="8" type="password"></div>
                            </div>
                            
                        </div>

                    </form>


                    <div class="third-section">

                        <button type="submit" form="form-deepest-dream">Create Account</button>
                        <p class="log-in">Already have an account? <a href="#" class="log-in-anchor">Log in</a></p>    
                    </div>

    </div>
    
</body>
</html>
